name: AXIS Frontend CI

on:
  push:
    branches: [ master, main, integrated-axis-frontend ]
    paths:
      - 'apps/web/**'
      - '.github/workflows/frontend-ci.yml'
      - 'package*.json'
      - 'turbo.json'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'apps/web/**'
      - '.github/workflows/frontend-ci.yml'
      - 'package*.json'

jobs:
  validate-frontend:
    name: Lint, Test & Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Workspace Dependencies
        run: npm ci

      - name: Run Vitest Unit & Contract Tests
        run: npm test --workspace=@axis/web

      - name: Run Production Bundle Build
        run: npm run build --workspace=@axis/web

      - name: Verify Clean SSR Output
        run: test -d apps/web/.svelte-kit/output

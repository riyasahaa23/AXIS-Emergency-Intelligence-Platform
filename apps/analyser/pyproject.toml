[project]
name = "axis-analyser"
version = "0.1.0"
description = "AXIS planetary emergency analysis engine"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "httpx>=0.27",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.1",
    "asyncpg>=0.31.0",
    "pandas>=3.0.6",
    "ecmwf-opendata>=0.3.34",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "migrations*"]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
    "mypy"
]

database = [
    "sqlalchemy[asyncio]>=2",
    "greenlet",
    "asyncpg",
    "geoalchemy2",
    "pgvector",
    "alembic"
]

events = [
    "redis>=5"
]

storage = [
    "boto3>=1.34"
]

ai = [
    "pydantic-ai",
    "ollama"
]

geo = [
    "geopandas",
    "shapely",
    "pyproj"
]

graph = [
    "networkx"
]

optimization = [
    "ortools"
]

voice = [
    "faster-whisper",
    "piper-tts"
]
